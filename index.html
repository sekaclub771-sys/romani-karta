<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Романи Карта" />
  <meta name="theme-color" content="#060a12" />
  <title>Романи Карта — Офлайн Навигатор РК, Камеры Сергек и Русские Ветки</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
      <style>
    html, body { height: 100dvh; width: 100vw; margin: 0; padding: 0; overflow: hidden; background: #060a12; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    #map { background: #060a12; }
    .leaflet-control-zoom { display: none !important; }
    .pb-safe { padding-bottom: max(14px, env(safe-area-inset-bottom)); }
    .ynav-micro-pill { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 !important; pointer-events: auto !important; cursor: pointer !important; }
    .ynav-micro-pill::before { display: none !important; }
  </style>
</head>
<body class="relative w-screen h-dvh overflow-hidden select-none bg-[#060a12]">
  <!-- Верхняя панель: Романи Карта + Поиск + Язык (РУС / РОМ) + Быстрые кнопки -->
  <header class="fixed inset-x-0 top-0 z-[500] px-3 pt-[max(10px,env(safe-area-inset-top))] pointer-events-none">
    <div class="max-w-[520px] mx-auto space-y-1.5 pointer-events-auto">
      <div class="flex items-center gap-1.5 bg-slate-900/95 backdrop-blur-2xl border border-slate-700 rounded-2xl p-1.5 shadow-2xl">
        <div class="px-2.5 py-1.5 rounded-xl bg-amber-400 text-slate-950 font-black text-xs shrink-0">🧭 Романи Карта</div>
        <input id="searchInput" type="text" oninput="renderMap()" placeholder="Поиск: город, село, район, трасса..." class="flex-1 min-w-0 px-3 py-1.5 text-xs bg-slate-800 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-amber-400" />
        <button onclick="toggleLang()" id="langBtn" class="px-2.5 py-1.5 rounded-xl bg-slate-800 border border-slate-700 text-amber-400 text-[11px] font-extrabold shrink-0">РУС</button>
      </div>
      <div class="flex items-center gap-1.5 overflow-x-auto">
        <button onclick="togglePopup('filterPopup')" class="px-3 py-1.5 rounded-xl bg-amber-400 text-slate-950 text-[11px] font-extrabold shadow shrink-0">📊 Население %</button>
        <button onclick="toggleBranches()" id="branchBtn" class="px-3 py-1.5 rounded-xl bg-sky-500/25 border border-sky-400 text-sky-300 text-[11px] font-extrabold shadow shrink-0">🌿 Русские ветки</button>
        <button onclick="toggleCameras()" id="camBtn" class="px-3 py-1.5 rounded-xl bg-rose-500/25 border border-rose-400 text-rose-300 text-[11px] font-extrabold shadow shrink-0">📷 Камеры (48)</button>
      </div>
    </div>
  </header>

  <div id="map" class="w-full h-full z-0"></div>

  <!-- Спидометр и Голосовой Радар-Детектор Сергек слева -->
  <div class="fixed left-3 top-[104px] z-[440] flex flex-col gap-2">
    <div class="p-2 rounded-2xl bg-slate-900/95 border border-slate-700 shadow-2xl flex items-center gap-2">
      <div class="px-2 py-1 rounded-xl bg-slate-950 border border-slate-800 text-center min-w-[52px]">
        <div id="speedVal" class="text-lg font-black font-mono leading-none text-white">62</div>
        <div class="text-[9px] font-bold text-slate-400">КМ/Ч</div>
      </div>
      <div onclick="speakCamera()" class="w-11 h-11 rounded-full bg-white border-[3.5px] border-rose-600 text-slate-950 font-black font-mono text-sm flex items-center justify-center shadow cursor-pointer" id="limitVal">60</div>
    </div>
    <button onclick="speakCamera()" class="px-2.5 py-1.5 rounded-2xl bg-slate-900/95 border border-rose-500/50 text-rose-300 text-[10px] font-extrabold shadow">🔊 Озвучить камеру</button>
  </div>

  <!-- Правые кнопки зума и GPS -->
  <div class="fixed right-3 top-1/2 -translate-y-1/2 z-[400] flex flex-col gap-2">
    <button onclick="playSound('tap');map.zoomIn()" class="w-11 h-11 rounded-2xl bg-slate-900/95 border border-slate-700 text-white font-bold text-xl">+</button>
    <button onclick="playSound('tap');map.zoomOut()" class="w-11 h-11 rounded-2xl bg-slate-900/95 border border-slate-700 text-white font-bold text-xl">−</button>
    <button onclick="locateUser()" class="w-11 h-11 rounded-2xl bg-amber-400 border border-amber-300 text-slate-950 font-black text-xs">GPS</button>
  </div>

  <!-- Мини-фильтр по населению -->
  <div id="filterPopup" class="hidden fixed top-[104px] left-1/2 -translate-x-1/2 w-[92vw] max-w-[390px] z-[650] bg-slate-900/95 backdrop-blur-2xl text-white rounded-3xl p-4 shadow-2xl border border-slate-700 space-y-3">
    <div class="flex items-center justify-between border-b border-slate-800 pb-2">
      <span class="font-bold text-xs text-amber-400 uppercase">Фильтр по русским и пенсионерам</span>
      <button onclick="togglePopup('filterPopup')" class="w-7 h-7 rounded-full bg-slate-800 text-slate-300">✕</button>
    </div>
    <div>
      <div class="flex justify-between text-xs mb-1">
        <span>Мин. % Русские + Немцы + Укр.:</span>
        <span id="minCombVal" class="font-mono text-sky-400 font-bold">0%</span>
      </div>
      <input id="minCombSlider" type="range" min="0" max="55" step="5" value="0" oninput="document.getElementById('minCombVal').innerText=this.value+'%';renderMap();" class="w-full accent-sky-400" />
    </div>
  </div>

  <!-- Всплывающее мини-окно выбранного поселка/города -->
  <div id="cardSheet" class="hidden fixed inset-x-3 bottom-20 sm:left-1/2 sm:-translate-x-1/2 sm:w-[410px] z-[600] bg-slate-900/95 backdrop-blur-2xl text-white rounded-3xl shadow-2xl border border-slate-700 p-3.5 max-h-[70dvh] overflow-y-auto"></div>

  <!-- Нижний док -->
  <nav class="fixed inset-x-0 bottom-0 z-[500] px-3 pt-2 pb-safe bg-slate-950/95 backdrop-blur-2xl border-t border-slate-800">
    <div class="max-w-[430px] mx-auto grid grid-cols-4 gap-2 text-center">
      <button onclick="locateUser()" class="py-2 rounded-2xl bg-slate-900 border border-slate-800 text-amber-400 text-xs font-extrabold">Ладав (GPS)</button>
      <button onclick="toggleBranches()" class="py-2 rounded-2xl bg-amber-400 text-slate-950 text-xs font-black">Рус. Ветки</button>
      <button onclick="toggleCameras()" class="py-2 rounded-2xl bg-slate-900 border border-slate-800 text-rose-400 text-xs font-extrabold">Камеры</button>
      <button onclick="clearRoute()" class="py-2 rounded-2xl bg-slate-900 border border-slate-800 text-emerald-400 text-xs font-extrabold">Сброс пути</button>
    </div>
  </nav>

    function playSound(kind) {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audioCtx) audioCtx = new Ctx();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = kind === 'route' ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(kind === 'route' ? 587 : 480, now);
        osc.frequency.exponentialRampToValueAtTime(kind === 'route' ? 880 : 220, now + 0.06);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now); osc.stop(now + 0.07);
      } catch {}
    }

    function speakText(msg) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(msg);
      u.lang = 'ru-RU';
      u.rate = lang === 'rom' ? 0.93 : 0.97;
      u.pitch = lang === 'rom' ? 0.96 : 1.0;
      window.speechSynthesis.speak(u);
    }

    function smoothCatmullRom(pts) {
      const p0 = pts[0], p1 = pts[pts.length - 1];
      const dLat = p1[0] - p0[0], dLng = p1[1] - p0[1];
      const ctrl = [
        p0, p0,
        [p0[0] + dLat * 0.25 - dLng * 0.05, p0[1] + dLng * 0.25 + dLat * 0.05],
        [p0[0] + dLat * 0.52 - dLng * 0.02, p0[1] + dLng * 0.52 + dLat * 0.02],
        [p0[0] + dLat * 0.78 + dLng * 0.03, p0[1] + dLng * 0.78 - dLat * 0.03],
        p1, p1
      ];
      const out = [];
      for (let i = 0; i < ctrl.length - 3; i++) {
        const a = ctrl[i], b = ctrl[i+1], c = ctrl[i+2], d = ctrl[i+3];
        for (let s = 0; s < 12; s++) {
          const t = s / 12, t2 = t * t, t3 = t2 * t;
          const lat = 0.5 * (2*b[0] + (-a[0]+c[0])*t + (2*a[0]-5*b[0]+4*c[0]-d[0])*t2 + (-a[0]+3*b[0]-3*c[0]+d[0])*t3);
          const lng = 0.5 * (2*b[1] + (-a[1]+c[1])*t + (2*a[1]-5*b[1]+4*c[1]-d[1])*t2 + (-a[1]+3*b[1]-3*c[1]+d[1])*t3);
          out.push([lat, lng]);
        }
      }
      out.push(p1);
      return out;
    }

          <div class="p-2 rounded-xl bg-emerald-950/60 border border-emerald-500/40"><div class="text-[9px] text-emerald-300">Казахи</div><div class="text-xs font-extrabold text-emerald-400">${item.kazPct}%</div></div>
        </div>
        <button onclick="buildRoute(${item.lat}, ${item.lng}, '${item.name.replace(/'/g, '')}', ${item.dist}, ${item.combPct}, ${item.pensPct})" class="w-full py-2.5 rounded-xl bg-amber-400 text-slate-950 font-black text-xs shadow">🚗 Ладас / Поехали (${item.dist} км)</button>
      `;
    }

    function buildRoute(lat, lng, name, dist, combPct, pensPct) {
      playSound('route');
      if (carTimer) clearInterval(carTimer);
      routeLayer.clearLayers();
      const smoothPts = smoothCatmullRom([userOrigin, [lat, lng]]);
      L.polyline(smoothPts, { renderer: canvasRenderer, color: '#022c22', weight: 10, lineCap: 'round' }).addTo(routeLayer);
      const line = L.polyline(smoothPts, { renderer: canvasRenderer, color: '#10b981', weight: 5.5, lineCap: 'round' }).addTo(routeLayer);
      map.fitBounds(line.getBounds(), { padding: [55, 55] });

      const carIcon = L.divIcon({ className: 'ynav-micro-pill', html: '<div style="transform:translate(-50%,-50%);padding:3px 7px;border-radius:999px;background:#fbbf24;color:#0f172a;font-size:10px;font-weight:900;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,0.6);">🚗 Ладас</div>' });
      const carMarker = L.marker(smoothPts[0], { icon: carIcon }).addTo(routeLayer);
      let idx = 0;
      carTimer = setInterval(() => {
        idx = (idx + 1) % smoothPts.length;
        carMarker.setLatLng(smoothPts[idx]);
      }, 320);

      speakText(lang === 'rom'
        ? `Ладас андо ${name}, пхрала! Саро дром — ${dist} километра... Русуря тай гадже — ${combPct} проценторя, пхуре — ${pensPct} проценторя.`
        : `Маршрут в ${name} построен. Расстояние — ${dist} километров. Поехали!`
      );
    }
    function clearRoute() { playSound('tap'); if (carTimer) clearInterval(carTimer); routeLayer.clearLayers(); }

    function locateUser() {
      playSound('tap');
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(pos => {
        userOrigin = [pos.coords.latitude, pos.coords.longitude];
        L.circleMarker(userOrigin, { renderer: canvasRenderer, radius: 9, fillColor: '#fbbf24', color: '#060a12', weight: 3, fillOpacity: 1 }).addTo(routeLayer);
        map.setView(userOrigin, 12, { animate: true });
      });
    }

    function renderMap() {
      branchesLayer.clearLayers();
      camerasLayer.clearLayers();
      markersLayer.clearLayers();
      labelsLayer.clearLayers();
      const zoom = map.getZoom();
      const bounds = map.getBounds();

      if (showBranches) {
        BRANCHES.forEach(b => {
          L.polyline(b.coords, { renderer: canvasRenderer, color: '#38bdf8', weight: 4, dashArray: '8,5' }).addTo(branchesLayer);
          const icon = L.divIcon({ className: 'ynav-micro-pill', html: `<div style="transform:translate(-50%,-50%);padding:2px 7px;border-radius:999px;background:#0f172a;border:1.5px solid #38bdf8;color:#fff;font-size:10px;font-weight:800;white-space:nowrap;">🌿 ${b.highwayCode}: ${b.russianCombinedPercent.toFixed(0)}% Рус · ${b.pensionerPercent.toFixed(0)}% Пенс</div>` });
          L.marker(b.forkCoord, { icon }).addTo(branchesLayer);
        });
      }

      if (showCams) {
        CAMERAS.forEach(c => {
          if (zoom < 8 && c.kind === 'sergek') return;
          const m = L.circleMarker([c.lat, c.lng], { renderer: canvasRenderer, radius: 6.5, fillColor: '#f43f5e', color: '#fff', weight: 2, fillOpacity: 0.95 });
          m.on('click', () => { activeCam = c; document.getElementById('limitVal').innerText = c.speedLimit; speakCamera(); });
          m.addTo(camerasLayer);
        });
      }

      const q = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
      const minComb = Number(document.getElementById('minCombSlider')?.value || 0);

      let labelCount = 0;
      const maxLabels = zoom >= 11 ? 45 : zoom >= 8 ? 28 : 18;

      DATA.filter(d => {
        if (!q && (d.type === 'район города' || d.type === 'микрорайон') && zoom < 11) return false;
        if (q && !d.name.toLowerCase().includes(q) && !d.former.toLowerCase().includes(q)) return false;
        return d.combPct >= minComb;
      }).forEach(item => {
        const col = item.combPct >= 35 ? '#f43f5e' : item.combPct >= 20 ? '#fbbf24' : '#38bdf8';
        const m = L.circleMarker([item.lat, item.lng], { renderer: canvasRenderer, radius: item.pop > 50000 ? 9.5 : 6.8, fillColor: col, color: '#0f172a', weight: 2, fillOpacity: 0.95 });
        m.on('click', () => openCard(item));
        m.addTo(markersLayer);

        if (labelCount < maxLabels && bounds.contains([item.lat, item.lng])) {
          labelCount++;
          const lblIcon = L.divIcon({
            className: 'ynav-micro-pill',
            html: `<div style="transform:translate(-50%,-100%);margin-top:-9px;padding:2px 6px;border-radius:999px;background:rgba(11,17,30,0.92);border:1px solid ${col};color:#fff;font-size:10px;font-weight:800;white-space:nowrap;">${item.name} · <span style="color:#38bdf8;">Рус ${item.combPct.toFixed(0)}%</span> · <span style="color:#fbbf24;">П ${item.pensPct.toFixed(0)}%</span></div>`
          });
          const lbl = L.marker([item.lat, item.lng], { icon: lblIcon, interactive: true });
          lbl.on('click', () => openCard(item));
          lbl.addTo(labelsLayer);
        }
      });
    }

    map.on('zoomend moveend', renderMap);
    renderMap();
  </script>
</body>
</html>
